---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: chrultrablue
# description will be included in the image's metadata
description: Another attempt at a Chromebook focused Universal Blue image.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/base-main
image-version: "42" # latest is also supported if you want new updates ASAP

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  # Work around https://github.com/wayblueorg/wayblue/issues/152
  #- type: script
  #  snippets:
  #    - "rpm-ostree override replace --experimental --from repo=fedora libheif heif-pixbuf-loader"

  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    repos:
      copr:
        - solopasha/hyprland
        - atim/starship
        - scottames/ghostty
      files:
        - https://repo.librewolf.net/librewolf.repo
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo # For keyd
    install:
      # Disable weak dependencies to reduce image size and build time
      install-weak-deps: false
      packages:
        # Gets the keys for terra which we need for keyd
        - terra-release

        # Terminal and shell utilities
        - starship
        - alacritty
        - ghostty

        # File managers and utilities
        - ripgrep
        - tar
        - unzip
        - wget
        - keyd

        # Development tools
        - cargo
        - clang
        - dbus-devel
        - pkgconf-pkg-config
        - openssl-devel
        - libxcb-devel

        # Text editors and IDEs
        - neovim

        # System utilities
        - bind-utils
        - brightnessctl
        - btop
        - fastfetch
        - iputils
        - pciutils
        - plocate
        - tldr
        - usbutils
        - whois
        - wiremix

        # Fonts
        - cascadia-code-nf-fonts
        - cascadia-mono-nf-fonts
        - fira-code-fonts
        - fontawesome-fonts-all
        - google-noto-fonts-common

        # Applications
        - librewolf
        - evince
        - gnome-calculator
        - imv
        - mpv
        - nautilus

        # Input methods
        - fcitx5
        - fcitx5-configtool
        - fcitx5-gtk
        - fcitx5-qt

        # File system and networking
        - gvfs-mtp
        - gvfs-smb
        - iwd
        - pipx
        - playerctl

        # Hyprland ecosystem
        - hyprcursor
        - hypridle
        - hyprland
        - hyprland-qt-support
        - hyprland-qtutils
        - hyprlock
        - hyprpaper
        - hyprpicker
        - hyprpolkitagent
        - hyprshot
        - hyprsunset
        - hyprsysteminfo
        - hyprutils
        - hyprwayland-scanner

        # Desktop components
        - kvantum-qt5
        - mako
        - swaybg
        - uwsm
        - waybar
        - wf-recorder
        - wl-clipboard
        - wofi
        - xdg-desktop-portal-gtk
        - xdg-desktop-portal-hyprland
        - xdg-user-dirs

        # Theming and icons
        - gnome-themes-extra
        - xmlstarlet
        - yaru-icon-theme

        # Additional tools
        - satty
        - slurp
        - sushi
        - curl
        - rsync
        - tmux
        - npm
        - meson
        - scdoc
        - pyprland
        - python3-pillow
        - python3-psutil
        - foot
        - jetbrains-mono-fonts
        - qt5ct
        - qt6ct
        - nwg-look
        - blueman
        - wdisplays
        - cliphist
        - gammastep
        - grimblast
        - pamixer
        - pavucontrol
        - swappy
        - swww
        - upower
        - yad
        - sddm

        # Boot and system
        - plymouth
        - plymouth-core-libs
        - plymouth-scripts
        - plymouth-system-theme
    remove:
      packages:
        - firefox
        - firefox-langpacks
        - NetworkManager*

  - type: files
    files:
      - source: scripts/omadora-build-time-setup.sh
        destination: /usr/bin/omadora-build-time-setup.sh

  - type: script
    snippets:
      - git clone https://github.com/elpritchos/omadora.git /etc/skel/.local/share/omadora
      - chmod +x /usr/bin/omadora-build-time-setup.sh
      - /usr/bin/omadora-build-time-setup.sh /etc/skel/.local/share/omadora
      - sed -i 's/env = GDK_SCALE,2/env = GDK_SCALE,1/' /etc/skel/.config/hypr/monitors.conf
      - sed -i 's/monitor=,preferred,auto,auto/monitor=,preferred,auto,1/' /etc/skel/.config/hypr/monitors.conf

  - type: files
    files:
      - source: customisations/waybar-style.css
        destination: /etc/skel/.config/waybar/style.css

  - type: script
    snippets:
      - cargo install --root /usr bluetui cargo-update eza impala

  - type: systemd
    system:
      enabled:
        - systemd-networkd.service
        - iwd.service
        - sddm.service
      disabled:
        - systemd-networkd-wait-online.service
      masked:
        - systemd-networkd-wait-online.service
    user:
      enabled:
        - omadora-battery-monitor.service
        - omadora-battery-monitor.timer

  - type: files
    files:
      - source: scripts/omadora-waybar-update
        destination: /usr/bin/omadora-waybar-update

  - type: script
    snippets:
      - chmod +x /usr/bin/omadora-waybar-update

  - type: script
    snippets:
      - echo 'exec-once = sleep 2 && $HOME/.local/share/omadora/install/config/detect-keyboard-layout.sh' >> /etc/skel/.config/hypr/autostart.conf

  # I know I have employed many hacks to get this script to run, but I really like this script
  - type: script
    snippets:
      - git clone https://github.com/WeirdTreeThing/cros-keyboard-map.git
      - cd cros-keyboard-map && sed -i 's/systemctl restart keyd/echo insert hack here/' install.sh && echo | ./install.sh

  - type: brew
    nofile-limits: true # increase nofile limits

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
